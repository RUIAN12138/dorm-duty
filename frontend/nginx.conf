# Caddy terminates TLS and supplies this header. Only accept canonical values;
# requests without an edge proxy retain their actual transport scheme.
map $http_x_forwarded_proto $dorm_forwarded_proto {
  default $scheme;
  https https;
  http http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location ~ ^/(auth|dorms|duties|guest|notifications|push|health|docs|openapi\.json)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $dorm_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
