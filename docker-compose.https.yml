# Run together with docker-compose.yml on a server whose DNS points DOMAIN here.
services:
  api:
    environment:
      # Uvicorn accepts forwarded headers only from this project bridge, not '*'.
      FORWARDED_ALLOW_IPS: ${DORM_PROXY_SUBNET:-172.30.61.0/24}
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?请提供解析到服务器的域名，不含协议或路径}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        # Change this if it overlaps an existing server/VPN/container network.
        - subnet: ${DORM_PROXY_SUBNET:-172.30.61.0/24}
volumes:
  caddy-data:
  caddy-config:
