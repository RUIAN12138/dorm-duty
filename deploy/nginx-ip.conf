server {
    listen 80 default_server;
    server_name 8.148.190.114;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/dorm-duty/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /dorm-duty/chores/calendar/ {
        access_log off;
        return 301 https://8.148.190.114$request_uri;
    }
    location / { return 301 https://8.148.190.114$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 8.148.190.114;
    ssl_certificate /opt/dorm-duty/letsencrypt/live/dorm-duty-ip/fullchain.pem;
    ssl_certificate_key /opt/dorm-duty/letsencrypt/live/dorm-duty-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DormDutyTLS:1m;
    ssl_session_timeout 1h;
    client_max_body_size 64k;

    location = / { return 302 /dorm-duty/; }
    location = /dorm-duty { return 301 /dorm-duty/; }
    location ^~ /dorm-duty/chores/calendar/ {
        access_log off;
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /dorm-duty/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}
