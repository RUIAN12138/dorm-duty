# Temporary IP entry used only while requesting the first trusted certificate.
server {
    listen 80 default_server;
    server_name 8.148.190.114;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/dorm-duty/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
