name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-business:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix site
      - name: Build and verify root website
        run: |
          npm run build --prefix frontend
          node site/scripts/embed-frontend.mjs
          node site/scripts/check-worker.mjs
      - name: Verify business and notification behavior
        run: |
          node site/scripts/build-email-runtime.mjs
          git diff --exit-code site/runtime/email-runtime.cjs
          python3 scripts/test_native_setup.py
          node site/scripts/check-cloud-backend.mjs
          node site/scripts/check-name-entry.mjs
          node site/scripts/check-history.mjs
          node site/scripts/check-recency.mjs
          node site/scripts/check-chores.mjs
          node site/scripts/check-rounds.mjs
          node site/scripts/check-round-order.mjs
          node site/scripts/check-water-reassign.mjs
          node site/scripts/check-polling-cost.mjs
          node site/scripts/check-member-push.mjs
          node site/scripts/check-native-push.mjs
          node site/scripts/check-water-nudge.mjs
          node site/scripts/check-completion.mjs
          node site/scripts/check-undo.mjs
          node site/scripts/check-native-back.mjs
          node site/scripts/check-native-bridge.mjs
          node site/scripts/check-harmony-basic-push.mjs
          node site/scripts/check-email-accounts.mjs
          node site/scripts/check-email-delivery.mjs
          node site/scripts/check-email-entry-policy.mjs
          node site/scripts/check-auth-boundaries.mjs
          node site/scripts/check-push-settings.mjs
          node site/scripts/check-calendar-subscription.mjs
          node site/scripts/check-calendar-settings.mjs
          node site/scripts/check-task-swipe.mjs
          node site/scripts/check-scheduled-reminders.mjs
          node site/scripts/check-reminder-runtime.mjs
          node site/scripts/check-creator-recovery.mjs
      - name: Install browser for interaction checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify mobile interaction foundation
        run: |
          node scripts/check-interaction-foundation.mjs
          node scripts/check-focus-compact.mjs
          node scripts/check-list-collapse-sync.mjs
          DORM_TOUCH=1 node scripts/check-focus-compact.mjs
          node scripts/check-completion-experience.mjs
          node scripts/check-round-calendar-motion.mjs
          node scripts/check-order-boundaries.mjs
          node scripts/check-entry-handoff.mjs
      - name: Keep interaction failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interaction-failure
          path: docs/evidence/interaction-foundation/failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build server website
        env:
          DORM_WEB_BASE: /dorm-duty/
        run: npm run build --prefix frontend -- --outDir dist-server
      - name: Verify email account HTTPS and mobile flow
        run: node scripts/check-email-experience.mjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and lint Android preview
        working-directory: native/android
        env:
          DORM_JPUSH_APPKEY: ${{ vars.DORM_ANDROID_JPUSH_APPKEY }}
        run: |
          ./gradlew --no-daemon :app:checkReleaseReadiness :app:testDebugUnitTest :app:assembleDebug :app:lintDebug "-PJPUSH_APPKEY=$DORM_JPUSH_APPKEY"
          python3 ../../scripts/check-android-push-manifest.py app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          if ./gradlew --no-daemon :app:assembleRelease > "$RUNNER_TEMP/dorm-release-gate.log" 2>&1; then
            echo "Release unexpectedly built without the fixed signing configuration" >&2
            exit 1
          fi
          grep -q '发布构建被阻止' "$RUNNER_TEMP/dorm-release-gate.log"
      - name: Keep Android preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lundao-android-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
