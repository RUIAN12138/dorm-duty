plugins { id 'com.android.application' }
def pushKey = providers.gradleProperty('JPUSH_APPKEY').getOrElse('')
if(pushKey && !(pushKey ==~ /[A-Fa-f0-9]{24}/)) throw new GradleException('JPUSH_APPKEY 必须是公开的 24 位应用标识')
android {
 namespace 'cn.lundao.dorm'
 compileSdk 35
 defaultConfig {
  applicationId 'cn.lundao.dorm'
  minSdk 23
  targetSdk 35
  versionCode 1
  versionName '1.1.0'
  manifestPlaceholders = [JPUSH_PKGNAME: applicationId, JPUSH_APPKEY: providers.gradleProperty('JPUSH_APPKEY').getOrElse(''), JPUSH_CHANNEL: 'dorm-direct']
  buildConfigField 'String', 'JPUSH_APPKEY', '"' + providers.gradleProperty('JPUSH_APPKEY').getOrElse('') + '"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'cn.jiguang.sdk:jpush:5.6.0'
 implementation('cn.jiguang.sdk:jcore:5.5.7') { version { strictly '5.5.7' } }
}
