schema: spec-driven
context: |
  项目“轮到”：现有 Vue 3 / TypeScript / Vite 前端，Node + SQLite 正式服务。
  使用中文；保留 OpenSpec 结构标题和 SHALL/MUST。先读 AGENTS.md 和 docs/FRONTEND_MOTION_CONTRACT.md。
  当前分支 codex/chat-motion-continuity。v72此前发布授权已履行；本轮新聊天动效及日历分段导航只做隔离预览，未经用户明确确认不得PR、推送、合并或发布。
  当前所有正式操作均未授权，不得复用上轮发布授权。后续正式发布先备份且不得覆盖数据库。
  最新覆盖：用户查看e71c0a0预览后明确“部署到网站”“并且提交 pr”，授权当前批次发布与创建PR所需的分支推送。两种动作各绑定当前摘要，acceptance仍pending；不授权main合并，不代表全平台验收。
  新一轮fix-companion-tap-arbitration及追加需求：用户明确“这次做完直接提交 pr 部署网站”；仅完成独立回归后的本批次PR和部署，可绑定新摘要，不授权合并main。
  不把测试通过、用户说“继续”、配置连接成功解释为产品验收；记录原话和对应版本。
  保留黑白简约风格、原布局、玻璃导航、主题、球球连续表情、完成/撤销、圆环、交接、日历/列表动效。
  后续明确需求覆盖旧要求时，只覆盖相应部分；聊天毛玻璃是用户明确允许的局部效果。
  单一动画驱动；只用 transform/opacity 做运动；系统减少动态效果直接终态。
  不修改密钥、.env、账号凭据、生产数据库，不复制真实数据到预览。
  规范及自动检查是协作约束，不是权限沙箱；不得声称能阻止所有越权或替代视觉验收。
rules:
  proposal:
    - 写清目标、非目标、用户原话、旧规则覆盖关系、风险与受影响范围。
    - 已实现功能回填必须标明回填，不得伪装成事前设计或用户已验收。
  specs:
    - 每个要求有可观察的正常、失败或中断场景，保护现有交互。
    - 不为使用参考组件而增加无关功能，不将模拟器结论称为真机结论。
  design:
    - 列出精确文件范围、复用组件和接口、手势优先级、动画单一驱动、回滚路径。
  tasks:
    - 将代码实现、自动测试、人工验收、发布授权分别记录；未执行不可勾选。
    - 验证包含真实页面中间帧、减动效、失败、反向中断和相关回归，不只构建或 class。
operations:
  apply:
    guidance:
      - 先运行 npm run spec:scope，修改后再次运行并核对无关 diff。
      - 范围外的必要修改须先说明并获得授权，再更新规范；不得移除既有动效来通过测试。
  archive:
    guidance:
      - 未经用户验收不得归档、同步为正式产品行为或宣称发布；先运行 npm run spec:gate -- --gate pr。
